services:
  
  postgres:
    restart: unless-stopped
    image: postgres:18
    ports: [ "5432:5432" ]
    environment: [ "POSTGRES_PASSWORD=postgres" ]
    volumes:
      - ".docker-volumes/postgres:/var/lib/postgresql"
      - "./postgres/docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d:ro"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
      
  minio:
    restart: unless-stopped
    image: quay.io/minio/minio:latest
    ports: [ "9000:9000", "9001:9001" ]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio-user
      MINIO_ROOT_PASSWORD: minio-password
    volumes: [ ".docker-volumes/minio:/data" ]
    healthcheck:
      test: [ "CMD", "curl", "-I", "http://localhost:9000/minio/health/live" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
  
  seq:
    restart: unless-stopped
    image: datalust/seq:2025.2
    ports: [ "5341:80" ]
    environment:
      ACCEPT_EULA: Y
      SEQ_FIRSTRUN_NOAUTHENTICATION: true
    volumes: [ ".docker-volumes/seq:/data" ]
    healthcheck:
      test: [ "CMD", "curl", "-I", "http://localhost:80/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
  
  server:
    image: un1ver5e/artisan.next.iii:latest-arm
    environment:
      Serilog__WriteTo__1__Args__serverUrl: http://seq:5341
      ConnectionStrings__Postgres: Host=postgres;User Id=artisan_next_iii;Password=artisan_next_iii;Database=artisan_next_iii;
      S3__ServiceUrl: http://minio:9000
      
      OAuth__Google__ClientId: $GoogleID
      OAuth__Google__ClientSecret: $GoogleSecret
      OAuth__Yandex__ClientId: $YandexID
      OAuth__Yandex__ClientSecret: $YandexSecret
